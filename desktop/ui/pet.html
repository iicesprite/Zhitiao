<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>纸条桌宠</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="pet.js"></script>
</head>
<body class="pet">
  <section id="pet-speech" hidden>
    <div aria-live="polite" aria-atomic="true">
      <h2 id="pet-speech-title"></h2>
      <p id="pet-speech-text" hidden></p>
    </div>
    <button id="pet-speech-open" class="text-button" type="button">查看纸条</button>
  </section>
  <button id="pet-button" aria-label="单击看心情，双击打开纸条" title="单击看心情，双击打开纸条，可以拖动桌宠">
    <img id="avatar" src="pet.svg" width="74" height="74" alt="" draggable="false">
    <span id="pet-status">纸条</span>
  </button>
</body>
</html>
